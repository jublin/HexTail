name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/HexTail.slnx
      - run: dotnet test src/HexTail.Tests/HexTail.Tests.csproj -c Release --no-restore
      - run: dotnet pack src/HexTail.LogGenerator/HexTail.LogGenerator.csproj -c Release --no-restore -p:PackageVersion=${GITHUB_REF_NAME#v} -o artifacts
      - run: dotnet nuget push artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      - run: gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
