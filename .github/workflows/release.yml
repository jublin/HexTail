name: release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Validate release tag against build version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(dotnet msbuild src/HexTail/HexTail.csproj -getProperty:Version)"
          tag_version="${RELEASE_TAG#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match build version '$package_version'."
            exit 1
          fi
          echo "value=$package_version" >> "$GITHUB_OUTPUT"
      - run: dotnet restore src/HexTail.slnx
      - run: dotnet test src/HexTail.Tests/HexTail.Tests.csproj -c Release --no-restore
      - run: dotnet pack src/HexTail/HexTail.csproj -c Release --no-restore -o artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: hextail-packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v8
        with:
          name: hextail-packages
          path: artifacts
      - uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish NuGet tool packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
        run: |
          for rid in linux-x64 osx-arm64 osx-x64 win-x64; do
            dotnet nuget push "artifacts/HexTail.${rid}.${PACKAGE_VERSION}.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
          dotnet nuget push "artifacts/HexTail.${PACKAGE_VERSION}.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create or update GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
