name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/HexTail.slnx
      - run: dotnet test src/HexTail.Tests/HexTail.Tests.csproj -c Release --no-restore
      - run: dotnet publish src/HexTail/HexTail.csproj -c Release -r ${{ matrix.rid }} --self-contained false
